<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analyzer & ATS Scorer</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Custom CSS via Flask url_for -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-cpu me-2"></i>AI Resume Analyzer
            </a>
            <span class="navbar-text text-light small">
                <i class="bi bi-check-circle-fill text-success me-1"></i> System Ready
            </span>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container my-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold display-6">Optimize Your Resume for ATS & AI</h1>
            <p class="text-muted lead">Upload your PDF resume and paste the job description to get instant match scores & actionable feedback.</p>
        </div>

        <!-- Submission Form -->
        <form action="#" method="POST" enctype="multipart/form-data">
            <div class="row g-4">
                
                <!-- Left Column: PDF Resume Upload -->
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-header bg-primary text-white py-3">
                            <i class="bi bi-file-earmark-pdf me-2"></i>1. Upload Resume
                        </div>
                        <div class="card-body d-flex flex-column justify-content-center">
                            <div class="upload-box mb-3">
                                <i class="bi bi-cloud-arrow-up display-4 text-primary"></i>
                                <h5 class="mt-2">Choose a PDF file</h5>
                                <p class="text-muted small mb-3">Supports .PDF format up to 10MB</p>
                                <input type="file" class="form-control" id="resume_file" name="resume_file" accept=".pdf" required>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Job Description Input -->
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-header bg-secondary text-white py-3">
                            <i class="bi bi-card-checklist me-2"></i>2. Target Job Description
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="job_description" class="form-label text-muted small fw-bold">PASTE JOB DESCRIPTION HERE</label>
                                <textarea class="form-control" id="job_description" name="job_description" rows="7" placeholder="Paste the full job posting requirements, required skills, and responsibilities here..." required></textarea>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Submit Button Row -->
            <div class="row mt-4">
                <div class="col text-center">
                    <button type="submit" class="btn btn-primary btn-lg btn-analyze shadow">
                        <i class="bi bi-lightning-charge me-2"></i>Analyze Resume Now
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
